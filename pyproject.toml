[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovlm"
version = "0.1.0"
description = "Resolving the NanoVLMs paper's visual encoder ambiguity (conv_on_patches vs conv_on_image)."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "tokenizers",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["nanovlm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
